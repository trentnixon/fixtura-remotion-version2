<text class="label">FRAME REVIEW · NOT A STYLED PROTOTYPE</text>
<text y="40" class="note">Fixed = required or explicitly chosen.</text>
<text y="70" class="note">Preferred = proposed geometry to review.</text>
<text y="100" class="note">Exploratory = optional bounded detail.</text>
<text y="145" class="label">FIXED · CANVAS AND DATA</text>
<text y="177" class="note">1080 × 1350; minimum safe margin 72 px.</text>
<text y="207" class="note">Complete data; supplied home/away order.</text>
<text y="237" class="note">Two equal peer modules; context comes last.</text>
<text y="282" class="label">PREFERRED · FRAME BUDGET</text>
<text y="314" class="note">88 px content inset; 904 px content width.</text>
<text y="344" class="note">Header ends at y=240; content starts y=260.</text>
<text y="374" class="note">390 px per fixture + 30 px repeat gap.</text>
<text y="404" class="note">Last fixture ends y=1070; footer rule y=1142.</text>
<text y="434" class="note">Sponsor region ends y=1262; 88 px bottom.</text>
<text y="479" class="label">FIXED · HEADER RELATIONSHIPS</text>
<text y="511" class="note">Shared grade above centred title.</text>
<text y="541" class="note">Independent upper-right organisation stamp.</text>
<text y="571" class="note">Preferred: shared round beneath title.</text>
<text y="601" class="note">Exploratory: connecting angle shown in grey.</text>
<text y="646" class="label">FIXED · MATCH RELATIONSHIPS</text>
<text y="678" class="note">One band; outer crests, inward full scores.</text>
<text y="708" class="note">Names beneath their own crest/score group.</text>
<text y="738" class="note">Unfilled outcome attached to lower boundary.</text>
<text y="768" class="note">Preferred: broken rule around outcome text.</text>
<text y="798" class="note">Boundary is 10 px below the filled surface.</text>
<text y="828" class="note">Short accent rule bridges that transition.</text>
<text y="873" class="label">FIXED · SUPPORT AND FOOTER</text>
<text y="905" class="note">Unboxed columns use shared inner alignment.</text>
<text y="935" class="note">Label rules; names left, figures right.</text>
<text y="965" class="note">Metadata, closing rule, then controlled gap.</text>
<text y="995" class="note">Centred sponsors retain sizing and order.</text>
<text y="1025" class="note">Sponsor boxes show max 64 px logo height.</text>
<text y="1070" class="label">EXPLORATORY · DETAILS</text>
<text y="1102" class="note">Dashed centre division may be omitted.</text>
<text y="1132" class="note">Small closing-rule end accent not shown.</text>
<text y="1177" class="label">FIXED · CONDITIONAL BEHAVIOUR</text>
<text y="1209" class="note">Absent stats collapse; outcome does not grow.</text>
<text y="1239" class="note">No sponsors: collapse footer and its separator.</text>
<text y="1269" class="note">Dense: follow recorded compression order.</text>
<text y="1314" class="caption">Not applicable: ranking columns, player photos, motion.</text>
<text y="1340" class="caption">Reason: static Results overlay, not a ladder or video build.</text>
