<!doctype html>
<!-- Design starter: cricket / team-roster (copy via scaffold) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreline - Cricket Team Roster</title>
    <link rel="stylesheet" href="/design/_shared/shell.css" />
    <link rel="stylesheet" href="/design/_shared/frame.css" />
    <link
      rel="stylesheet"
      href="/design/_templates/cricket/starter-shared.css"
    />
    <link
      rel="stylesheet"
      href="/design/_templates/cricket/starter-team-roster.css"
    />
  </head>
  <body class="design-shell">
    <header class="design-topbar">
      <strong>Fixtura Design Prototypes</strong>
      <nav class="design-topbar-links" aria-label="Design tools">
        <a href="/design/guide/">Guide</a>
        <a href="/design/interview/">Design interview</a>
      </nav>
    </header>
    <p class="design-error" data-hydrate-error hidden></p>
    <div class="design-layout">
      <nav class="design-sidebar" aria-label="Templates">
        <h2>Templates</h2>
        <ul data-design-variant-nav></ul>
      </nav>
      <div class="design-main">
        <nav
          class="design-tabs"
          aria-label="Asset types"
          data-design-tabs
        ></nav>
        <div class="design-canvas-wrap">
          <div class="design-frame-scale">
            <div
              class="design-social-canvas template-canvas"
              data-roster
              data-sponsor-state="placeholder"
            >
              <span
                class="fixture-palette"
                data-hydrate="palette-primary"
              ></span>
              <span
                class="fixture-palette"
                data-hydrate="palette-secondary"
              ></span>

              <!-- Asset Header -->
              <header class="scoreline-header">
                <div class="header-shell">
                  <div class="header-shell__main">
                    <div class="header-identity-lockup">
                      <div class="organisation-mark">
                        <span class="mark-fallback" aria-hidden="true"></span>
                        <img
                          alt="Club logo"
                          data-hydrate="club-logo"
                          data-hydrate-attr="src"
                          onerror="this.hidden=true"
                        />
                      </div>
                    </div>
                    <div class="header-title-stack">
                      <p class="header-eyebrow" data-hydrate="header-eyebrow">
                        Team List
                      </p>
                      <h1 class="header-title" data-hydrate="header-title">
                        Team Roster
                      </h1>
                    </div>
                  </div>
                  <div class="header-shell__crease" aria-hidden="true">
                    <div class="crease-rule">
                      <span class="crease-post crease-post--primary"></span>
                      <span class="crease-rail"
                        ><span class="crease-rail__primary"></span
                        ><span class="crease-rail__secondary"></span
                      ></span>
                      <span class="crease-post crease-post--secondary"></span>
                    </div>
                  </div>
                </div>
              </header>

              <!-- Roster Content Area -->
              <main class="roster-ledger">
                <div class="roster-stack">
                  <!-- Matchup Band -->
                  <div class="fixture-matchup">
                    <div
                      class="team-band team-band--home"
                      data-hydrate="home-club"
                      data-hydrate-attr="data-club-team"
                    >
                      <div class="team-mark">
                        <span class="mark-fallback" aria-hidden="true"></span>
                        <img
                          alt="Home team logo"
                          data-hydrate="home-logo"
                          data-hydrate-attr="src"
                          onerror="this.hidden=true"
                        />
                      </div>
                      <div class="team-copy">
                        <span class="team-side-label">Home</span>
                        <p class="team-name" data-hydrate="home-team">Home</p>
                      </div>
                    </div>
                    <div class="fixture-centre" aria-hidden="true">
                      <span class="fixture-vs">V</span>
                    </div>
                    <div class="team-band team-band--away">
                      <div class="team-mark">
                        <span class="mark-fallback" aria-hidden="true"></span>
                        <img
                          alt="Away team logo"
                          data-hydrate="away-logo"
                          data-hydrate-attr="src"
                          onerror="this.hidden=true"
                        />
                      </div>
                      <div class="team-copy">
                        <span class="team-side-label">Away</span>
                        <p class="team-name" data-hydrate="away-team">Away</p>
                      </div>
                    </div>
                  </div>

                  <div class="roster-grade">
                    <h2 class="roster-grade-name" data-hydrate="grade-name">
                      Grade
                    </h2>
                    <p class="roster-grade-meta">
                      <span class="meta-chip" data-hydrate="fixture-type"
                        >Type</span
                      ><span class="meta-separator"></span
                      ><span class="meta-chip" data-hydrate="fixture-round"
                        >Round</span
                      ><span
                        class="meta-separator meta-separator--secondary"
                      ></span
                      ><span class="meta-chip" data-hydrate="fixture-age"
                        >Age</span
                      ><span class="meta-separator"></span
                      ><span class="meta-chip" data-hydrate="fixture-gender"
                        >Gender</span
                      >
                    </p>
                  </div>

                  <!-- Line-up List -->
                  <div class="roster-lineup">
                    <div class="roster-squad-header">
                      <span class="roster-squad-label">Line-up</span>
                      <p class="roster-squad-team" data-roster-squad-team>
                        Squad
                      </p>
                    </div>

                    <div class="roster-rows" data-roster-rows></div>
                  </div>

                  <!-- Fixture Metadata -->
                  <div class="roster-context">
                    <p class="roster-context-date" data-hydrate="fixture-date">
                      Date
                    </p>
                    <p
                      class="roster-context-venue"
                      data-hydrate="fixture-ground"
                    >
                      Ground
                    </p>
                  </div>
                </div>
              </main>

              <!-- Asset Footer -->
              <footer class="asset-footer">
                <div class="footer-crease" aria-hidden="true">
                  <div class="crease-rule">
                    <span class="crease-post crease-post--primary"></span>
                    <span class="crease-rail"
                      ><span class="crease-rail__primary"></span
                      ><span class="crease-rail__secondary"></span
                    ></span>
                    <span class="crease-post crease-post--secondary"></span>
                  </div>
                </div>
                <div class="sponsor-strip">
                  <div class="sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span
                    ><span>Partner</span>
                  </div>
                  <div class="sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span
                    ><span>Partner</span>
                  </div>
                  <div class="sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span
                    ><span>Partner</span>
                  </div>
                </div>
              </footer>
            </div>
          </div>
        </div>
        <footer class="design-handoff" data-design-handoff></footer>
      </div>
    </div>

    <template id="roster-row-template">
      <div class="roster-entry">
        <div class="roster-row">
          <span class="roster-index"></span>
          <p class="roster-player"></p>
          <div class="roster-badges"></div>
        </div>
        <div class="roster-crease" aria-hidden="true">
          <div class="crease-rule">
            <span class="crease-post crease-post--primary"></span>
            <span class="crease-rail"
              ><span class="crease-rail__primary"></span
              ><span class="crease-rail__secondary"></span
            ></span>
            <span class="crease-post crease-post--secondary"></span>
          </div>
        </div>
      </div>
    </template>

    <script type="module">
      import { renderVariantNav } from "/design/_shared/nav.js";
      import { renderTabBar } from "/design/_shared/tab-bar.js";
      import { initDesignPage } from "/design/_shared/init-template.js";

      const context = {
        variantSlug: "starter-preview",
        sportSlug: "cricket",
        assetSlug: "team-roster",
      };

      renderVariantNav(context.variantSlug);
      renderTabBar(context);
      await initDesignPage(context);
    </script>
  </body>
</html>
