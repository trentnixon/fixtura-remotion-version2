<!doctype html>
<!--
  Handoff: scoreline / cricket / team-roster
  Registry: Scoreline (provisional)
  Remotion: src/compositions/cricket/teamRoster/
  Theme: The Crease System (Barlow Condensed + Source Sans 3)
  Fixture: testData/samples/Cricket/Cricket_Roster.json
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreline - Cricket Team Roster</title>
    <link rel="stylesheet" href="/design/_shared/shell.css" />
    <link rel="stylesheet" href="/design/_shared/frame.css" />
        <link rel="stylesheet" href="/design/_shared/scoreline-polish.css" />
    <link rel="stylesheet" href="/design/_shared/scoreline-team-roster.css" />
    <link rel="stylesheet" href="/design/_shared/scoreline-preview.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
      import { applyVariantFonts } from "/design/_shared/fonts.js";

      const fontFamily = await applyVariantFonts("scoreline");

      tailwind.config = {
        theme: {
          extend: {
            fontFamily,
          },
        },
      };
    </script>

</head>
  <body class="design-shell">
    <header class="design-topbar">
      <strong>Fixtura Design Prototypes</strong>
      <a href="/design/guide/">Guide</a>
    </header>
    <p class="design-error" data-hydrate-error hidden></p>
    <div class="design-layout">
      <nav class="design-sidebar" aria-label="Templates">
        <h2>Templates</h2>
        <ul data-design-variant-nav></ul>
      </nav>
      <div class="design-main">
        <nav
          class="design-tabs"
          aria-label="Asset types"
          data-design-tabs
        ></nav>
        <div class="design-canvas-wrap">
          <div class="design-frame-scale">
            <div
              class="design-social-canvas scoreline-canvas"
              data-roster
              data-sponsor-state="placeholder"
            >
              <span
                class="fixture-palette"
                data-hydrate="palette-primary"
              ></span>
              <span
                class="fixture-palette"
                data-hydrate="palette-secondary"
              ></span>

              <!-- Asset Header -->
              <header class="scoreline-header">
                <div class="header-shell">
                  <div class="header-shell__main">
                    <div class="header-identity-lockup">
                      <div class="organisation-mark">
                        <span class="mark-fallback" aria-hidden="true"></span>
                        <img
                          alt="Club logo"
                          data-hydrate="club-logo"
                          data-hydrate-attr="src"
                          onerror="this.hidden=true"
                        />
                      </div>
                      <div class="header-identity">
                        <p class="organisation-name" data-hydrate="club-name">
                          Club name
                        </p>
                      </div>
                    </div>
                    <div class="header-title-stack">
                      <p class="header-eyebrow" data-hydrate="header-eyebrow">
                        Team List
                      </p>
                    </div>
                  </div>
                  <div class="header-shell__crease" aria-hidden="true">
                    <div class="crease-rule">
                      <span class="crease-post crease-post--primary"></span>
                      <span class="crease-rail"
                        ><span class="crease-rail__primary"></span
                        ><span class="crease-rail__secondary"></span
                      ></span>
                      <span class="crease-post crease-post--secondary"></span>
                    </div>
                  </div>
                </div>
              </header>

              <!-- Roster Content Area -->
              <main class="roster-ledger">
                <div class="roster-stack">
                  <!-- Matchup Band -->
                  <div class="fixture-matchup">
                    <div
                      class="team-band team-band--home"
                      data-hydrate="home-club"
                      data-hydrate-attr="data-club-team"
                    >
                      <div class="team-mark">
                        <span class="mark-fallback" aria-hidden="true"></span>
                        <img
                          alt="Home team logo"
                          data-hydrate="home-logo"
                          data-hydrate-attr="src"
                          onerror="this.hidden=true"
                        />
                      </div>
                      <div class="team-copy">
                        <span class="team-side-label">Home</span>
                        <p class="team-name" data-hydrate="home-team">Home</p>
                      </div>
                    </div>
                    <div class="fixture-centre" aria-hidden="true">
                      <span class="fixture-vs">V</span>
                    </div>
                    <div class="team-band team-band--away">
                      <div class="team-mark">
                        <span class="mark-fallback" aria-hidden="true"></span>
                        <img
                          alt="Away team logo"
                          data-hydrate="away-logo"
                          data-hydrate-attr="src"
                          onerror="this.hidden=true"
                        />
                      </div>
                      <div class="team-copy">
                        <span class="team-side-label">Away</span>
                        <p class="team-name" data-hydrate="away-team">Away</p>
                      </div>
                    </div>
                  </div>

                  <div class="roster-grade">
                    <h2 class="roster-grade-name" data-hydrate="grade-name">
                      Grade
                    </h2>
                    <p class="roster-grade-meta">
                      <span class="meta-chip" data-hydrate="fixture-type"
                        >Type</span
                      ><span class="meta-separator"></span
                      ><span class="meta-chip" data-hydrate="fixture-round"
                        >Round</span
                      ><span
                        class="meta-separator meta-separator--secondary"
                      ></span
                      ><span class="meta-chip" data-hydrate="fixture-age"
                        >Age</span
                      ><span class="meta-separator"></span
                      ><span class="meta-chip" data-hydrate="fixture-gender"
                        >Gender</span
                      >
                    </p>
                  </div>

                  <!-- Line-up List -->
                  <div class="roster-lineup">
                    <div class="roster-squad-header">
                      <span class="roster-squad-label">Line-up</span>
                      <p class="roster-squad-team" data-roster-squad-team>
                        Squad
                      </p>
                    </div>

                    <div class="roster-rows" data-roster-rows></div>
                  </div>

                  <!-- Fixture Metadata -->
                  <div class="roster-context">
                    <p class="roster-context-date" data-hydrate="fixture-date">
                      Date
                    </p>
                    <p
                      class="roster-context-venue"
                      data-hydrate="fixture-ground"
                    >
                      Ground
                    </p>
                  </div>
                </div>
              </main>

              <!-- Asset Footer -->
              <footer class="asset-footer">
                <div class="footer-crease" aria-hidden="true">
                  <div class="crease-rule">
                    <span class="crease-post crease-post--primary"></span>
                    <span class="crease-rail"
                      ><span class="crease-rail__primary"></span
                      ><span class="crease-rail__secondary"></span
                    ></span>
                    <span class="crease-post crease-post--secondary"></span>
                  </div>
                </div>
                <div class="sponsor-strip">
                  <div class="sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span
                    ><span>Partner</span>
                  </div>
                  <div class="sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span
                    ><span>Partner</span>
                  </div>
                  <div class="sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span
                    ><span>Partner</span>
                  </div>
                </div>
              </footer>
            </div>
          </div>
        </div>
        <footer class="design-handoff" data-design-handoff></footer>
      </div>
    </div>

    <template id="roster-row-template">
      <div class="roster-entry">
        <div class="roster-row">
          <span class="roster-index"></span>
          <p class="roster-player"></p>
          <div class="roster-badges"></div>
        </div>
        <div class="roster-crease" aria-hidden="true">
          <div class="crease-rule">
            <span class="crease-post crease-post--primary"></span>
            <span class="crease-rail"
              ><span class="crease-rail__primary"></span
              ><span class="crease-rail__secondary"></span
            ></span>
            <span class="crease-post crease-post--secondary"></span>
          </div>
        </div>
      </div>
    </template>

    <script type="module">
      import { renderVariantNav } from "/design/_shared/nav.js";
      import { renderTabBar } from "/design/_shared/tab-bar.js";
      import { initScorelineAsset } from "/design/_shared/scoreline-init.js";
      import { syncScorelineRosterLayout } from "/design/_shared/scoreline-layout.js";

      const context = {
        variantSlug: "scoreline",
        sportSlug: "cricket",
        assetSlug: "team-roster",
      };

      const parsePlayerEntry = (raw) => {
        const value = String(raw ?? "").trim();
        if (!value || /no players allocated/i.test(value)) {
          return { emptyRoster: true, name: value || "No players allocated" };
        }

        const lines = value.split("\n");
        let name = lines[0]?.trim() ?? "";
        const badges = [];

        const role = lines[1]?.trim().toLowerCase() ?? "";
        if (role === "c") {
          badges.push({ label: "C", captain: true });
        } else if (role === "vc") {
          badges.push({ label: "VC", captain: false });
        }

        if (/\(WK\)/i.test(name)) {
          badges.push({ label: "WK", captain: false });
          name = name.replace(/\(WK\)/gi, "").trim();
        }

        return { emptyRoster: false, name, badges };
      };

      const resolveDensity = (count) => {
        if (count <= 11) {
          return "normal";
        }
        if (count <= 14) {
          return "compact";
        }
        return "tight";
      };

      const mountRosterRows = (players) => {
        const container = document.querySelector("[data-roster-rows]");
        const template = document.getElementById("roster-row-template");
        if (!(container instanceof HTMLElement) || !(template instanceof HTMLTemplateElement)) {
          return;
        }

        container.innerHTML = "";

        if (players.length === 0 || players.every((entry) => parsePlayerEntry(entry).emptyRoster)) {
          const fragment = template.content.cloneNode(true);
          const entry = fragment.querySelector(".roster-entry");
          const row = fragment.querySelector(".roster-row");
          const index = row?.querySelector(".roster-index");
          const player = row?.querySelector(".roster-player");
          const badges = row?.querySelector(".roster-badges");
          const crease = fragment.querySelector(".roster-crease");

          if (row instanceof HTMLElement) {
            row.dataset.emptyRoster = "true";
          }
          if (index instanceof HTMLElement) {
            index.hidden = true;
          }
          if (badges instanceof HTMLElement) {
            badges.hidden = true;
          }
          if (player instanceof HTMLElement) {
            player.textContent = "No players allocated to line-up";
          }
          if (crease instanceof HTMLElement) {
            crease.hidden = true;
          }
          if (entry instanceof HTMLElement) {
            container.appendChild(fragment);
          }
          return;
        }

        container.dataset.density = resolveDensity(players.length);

        players.forEach((rawPlayer, playerIndex) => {
          const parsed = parsePlayerEntry(rawPlayer);
          if (parsed.emptyRoster) {
            return;
          }

          const fragment = template.content.cloneNode(true);
          const entry = fragment.querySelector(".roster-entry");
          const row = fragment.querySelector(".roster-row");
          const index = row?.querySelector(".roster-index");
          const player = row?.querySelector(".roster-player");
          const badges = row?.querySelector(".roster-badges");

          if (index instanceof HTMLElement) {
            index.textContent = String(playerIndex + 1);
          }
          if (player instanceof HTMLElement) {
            player.textContent = parsed.name;
            player.title = parsed.name;
          }
          if (badges instanceof HTMLElement) {
            parsed.badges.forEach((badge) => {
              const chip = document.createElement("span");
              chip.className = badge.captain
                ? "roster-badge roster-badge--captain"
                : "roster-badge";
              chip.textContent = badge.label;
              badges.appendChild(chip);
            });
            if (parsed.badges.length === 0) {
              badges.hidden = true;
            }
          }

          if (entry instanceof HTMLElement) {
            container.appendChild(fragment);
          }
        });
      };

      renderVariantNav(context.variantSlug);
      renderTabBar(context);
      await initScorelineAsset(context, {
        afterHydrate: async () => {
          document.querySelectorAll(".meta-chip").forEach((chip) => {
            if (chip instanceof HTMLElement) {
              chip.dataset.empty = chip.textContent?.trim() ? "false" : "true";
            }
          });

          const fixtureResponse = await fetch(
            "/testData/samples/Cricket/Cricket_Roster.json",
          );
          if (fixtureResponse.ok) {
            const fixture = await fixtureResponse.json();
            const roster = fixture.data?.[0];

            if (roster) {
              const squadTeam = document.querySelector("[data-roster-squad-team]");
              if (squadTeam instanceof HTMLElement) {
                squadTeam.textContent = roster.isHomeTeam
                  ? roster.teamHome
                  : roster.teamAway;
              }

              mountRosterRows(
                Array.isArray(roster.teamRoster) ? roster.teamRoster : [],
              );
            }
          }

          syncScorelineRosterLayout(document);
        },
      });
    </script>
  </body>
</html>
