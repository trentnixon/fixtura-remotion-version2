<!doctype html>
<!--
  Handoff: night-session / cricket / intro
  Canvas root: .template-canvas
  Remotion: NightSessionIntro (template intro sequence)
  Fixture: testData/samples/Cricket/Cricket_Results.json
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Session — Intro</title>
    <link rel="stylesheet" href="/design/_shared/shell.css" />
    <link rel="stylesheet" href="/design/_shared/frame.css" />
    <link rel="stylesheet" href="/design/_shared/night-session-shared.css" />
    <link rel="stylesheet" href="/design/_shared/night-session-intro.css" />
    <link rel="stylesheet" href="/design/_shared/night-session-broadcast.css" />
    <link rel="stylesheet" href="/design/_shared/night-session-preview.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
      import { applyVariantFonts } from "/design/_shared/fonts.js";

      const fontFamily = await applyVariantFonts("night-session");

      tailwind.config = {
        theme: {
          extend: {
            fontFamily,
          },
        },
      };
    </script>
  </head>
  <body class="design-shell">
    <header class="design-topbar">
      <strong>Fixtura Design Prototypes</strong>
      <nav class="design-topbar-links" aria-label="Design tools">
        <a href="/design/guide/">Guide</a>
        <a href="/design/interview/">Design interview</a>
      </nav>
    </header>
    <p class="design-error" data-hydrate-error hidden></p>
    <div class="design-layout">
      <nav class="design-sidebar" aria-label="Templates">
        <h2>Templates</h2>
        <ul data-design-variant-nav></ul>
      </nav>
      <div class="design-main">
        <nav
          class="design-tabs"
          aria-label="Asset types"
          data-design-tabs
        ></nav>
        <div class="design-canvas-wrap">
          <div class="design-frame-scale">
            <div
              class="design-social-canvas template-canvas night-session-canvas night-session-intro"
              data-sponsor-state="placeholder"
            >
              <span
                class="fixture-palette"
                data-hydrate="palette-primary"
              ></span>
              <span
                class="fixture-palette"
                data-hydrate="palette-secondary"
              ></span>

              <div class="night-session-intro__frame">
                <div class="night-session-intro__main">
                  <div class="night-session-intro__animated">
                    <div class="night-session-intro__panel">
                      <header class="ns-header ns-header--intro">
                        <div class="ns-header__accent" aria-hidden="true">
                          <span class="ns-accent-wedge"></span>
                          <span class="ns-accent-lines"></span>
                        </div>
                        <div
                          class="organisation-mark ns-header__mark"
                          data-has-crest="true"
                        >
                          <span class="mark-fallback" aria-hidden="true"></span>
                          <img
                            alt="Club logo"
                            data-hydrate="club-logo"
                            data-hydrate-attr="src"
                            onerror="this.hidden=true"
                          />
                        </div>
                        <div class="ns-header__lockup">
                          <p
                            class="header-eyebrow"
                            data-hydrate="header-eyebrow"
                          >
                            Grade label
                          </p>
                          <h1 class="header-title" data-hydrate="header-title">
                            Weekend Results
                          </h1>
                        </div>
                        <p class="sr-only" data-hydrate="club-name">Club</p>
                      </header>
                    </div>
                  </div>
                </div>

                <div class="night-session-intro__sponsors">
                  <div class="night-session-intro__sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span>
                    <span>Partner</span>
                  </div>
                  <div class="night-session-intro__sponsor-slot">
                    <span class="sponsor-symbol" aria-hidden="true"></span>
                    <span>Partner</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <footer class="design-handoff" data-design-handoff></footer>
      </div>
    </div>
    <script type="module">
      import { renderVariantNav } from "/design/_shared/nav.js";
      import { renderTabBar } from "/design/_shared/tab-bar.js";
      import { initNightSessionAsset } from "/design/_shared/night-session-init.js";

      const context = {
        variantSlug: "night-session",
        sportSlug: "cricket",
        assetSlug: "intro",
      };

      renderVariantNav(context.variantSlug);
      renderTabBar(context);
      await initNightSessionAsset(context);
    </script>
  </body>
</html>
